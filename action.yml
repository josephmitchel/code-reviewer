name: Code Reviewer
description: >-
  Multi-agent PR review: audits a pull request against the ISO/IEC 25010 quality
  characteristics, asks the owner questions on the PR, pushes fixes once they are answered,
  verifies them, and gates the PR with a commit status.

inputs:
  repo:
    description: The owner/repo under review. Defaults to the calling repository.
    default: ${{ github.repository }}
  pr:
    description: >-
      PR number to review. Leave empty to take the next queued review instead, which is what
      the scheduled sweep does.
    default: ''
  database-url:
    description: Postgres connection string holding the reviewer's state.
    required: true
  claude-code-oauth-token:
    description: Token from `claude setup-token`. Bills the agents to your Claude subscription.
    required: true
  app-client-id:
    description: Client ID of the GitHub App the reviewer acts as.
    required: true
  app-private-key:
    description: Private key (PEM) of that GitHub App.
    required: true
  agent-concurrency:
    description: >-
      How many auditor agents run at once. Each is a Claude Code subprocess, and they share the
      runner with the reviewed repo's test suite, so this is well below the local default of 10.
    default: '5'
  git-name:
    description: >-
      Commit author name for the fixer's commits. Defaults to the bot account of the GitHub App
      this reviewer runs as, so a fix in a repository's permanent history carries the same identity
      as the review that asked for it. Override it if you run a different App.
    default: jm-code-reviewer[bot]
  git-email:
    description: >-
      Commit author email for the fixer's commits. The numeric prefix is the bot account's user id:
      GitHub's <id>+<login>@users.noreply.github.com form is what makes it attribute the commit to
      that account, avatar and link included, rather than showing an author it cannot resolve.
    default: 338258166+jm-code-reviewer[bot]@users.noreply.github.com
  repo-env:
    description: >-
      Extra environment variables the reviewed repo's own setup and test commands need, as
      newline-separated KEY=VALUE lines (for example TEST_DATABASE_URL=...). The reviewer's own
      credentials are deliberately withheld from those commands, so this is how a repo says what
      its suites do need. Passed as an input rather than read from the job environment because a
      composite action's steps do not reliably inherit workflow- or job-level `env`.
    default: ''
  dispatch-workflow:
    description: >-
      Workflow filename to dispatch when a review finishes and the slot frees, so a queued PR
      starts at once rather than waiting for the sweep. Empty disables the hand-off.
    default: ''
  dispatch-ref:
    description: >-
      Ref to dispatch that workflow on. Empty asks GitHub for the repo's default branch, which
      is right for any project without naming a branch here.
    default: ''
  node-version:
    description: Node version. Matches the version the reviewer is developed against.
    default: '24'

outputs:
  outcome:
    description: passed | awaiting_answers | queued | skipped
    value: ${{ steps.review.outputs.outcome }}

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v5
      with:
        node-version: ${{ inputs.node-version }}
        # No `cache: npm` here on purpose: setup-node resolves cache-dependency-path against the
        # workspace, and this action's lockfile lives outside it under _actions/. Installing the
        # reviewer's dependencies cold costs well under a minute against rounds measured in tens.

    - name: Install the reviewer
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci

    - name: Apply database migrations
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        DATABASE_URL: ${{ inputs.database-url }}
      # Advisory-locked, unlike `drizzle-kit migrate`: one database serves every project while the
      # workflow's concurrency group is per repo, so two repos opening a PR in the same minute would
      # otherwise both apply the same pending migration and the loser would fail its whole review.
      run: node bin/code-reviewer.mjs migrate

    - name: Configure git for the fixer
      shell: bash
      env:
        GIT_NAME: ${{ inputs.git-name }}
        GIT_EMAIL: ${{ inputs.git-email }}
      # The fixer agent runs `git commit` and `git push` itself. The identity has to exist before
      # it does, and the credential helper has to be able to mint a token *then* — an App token
      # lives an hour and a round can run longer, so nothing is stored here. `bin/code-reviewer.mjs`
      # is not executable in git, hence the explicit `node`.
      run: |
        set -euo pipefail
        git config --global user.name "$GIT_NAME"
        git config --global user.email "$GIT_EMAIL"
        git config --global credential.helper \
          "!node '${{ github.action_path }}/bin/git-credential.mjs'"

    - name: Review
      id: review
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        DATABASE_URL: ${{ inputs.database-url }}
        CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.claude-code-oauth-token }}
        REVIEWER_APP_CLIENT_ID: ${{ inputs.app-client-id }}
        REVIEWER_APP_PRIVATE_KEY: ${{ inputs.app-private-key }}
        REVIEWER_APP_INSTALL_REPO: ${{ inputs.repo }}
        REVIEWER_AGENT_CONCURRENCY: ${{ inputs.agent-concurrency }}
        # Checked out beside the runner's other scratch space, NOT under this action's own install
        # tree: there the reviewed repo would sit beneath the reviewer's node_modules and git config,
        # close enough for one of its scripts to rewrite the live credential helper and for its test
        # suite to resolve modules out of ours.
        REVIEWER_WORKSPACE_ROOT: ${{ runner.temp }}/code-reviewer-workspaces
        REVIEWER_GIT_NAME: ${{ inputs.git-name }}
        REVIEWER_GIT_EMAIL: ${{ inputs.git-email }}
        REVIEWER_DISPATCH_WORKFLOW: ${{ inputs.dispatch-workflow }}
        REVIEWER_DISPATCH_REF: ${{ inputs.dispatch-ref }}
        REPO: ${{ inputs.repo }}
        PR: ${{ inputs.pr }}
        # Carried as one variable and applied only to the reviewed repo's child processes. It is
        # deliberately NOT exported here: shell-exporting it put repo-supplied names into the
        # reviewer's own environment, where `DATABASE_URL` would have repointed the reviewer.
        REVIEWER_REPO_ENV: ${{ inputs.repo-env }}
      # Every child process inherits this environment, which is how the fixer's `git push` reaches
      # the credential helper with the App credentials it needs.
      run: |
        set -euo pipefail
        if [ -z "$PR" ]; then
          PR="$(node bin/code-reviewer.mjs next "$REPO")"
        fi
        if [ -z "$PR" ]; then
          echo 'nothing to review'
          echo 'outcome=skipped' >> "$GITHUB_OUTPUT"
          exit 0
        fi
        # Published before the long part starts, so the cleanup step below knows which review to
        # record if this job is cancelled or hits its timeout partway through.
        echo "pr=$PR" >> "$GITHUB_OUTPUT"
        echo "reviewing $REPO#$PR"
        node bin/code-reviewer.mjs run "$REPO" "$PR" --once | tee review.log
        OUTCOME="$(grep -oE '^outcome: [a-z_]+' review.log | tail -1 | cut -d' ' -f2 || true)"
        echo "outcome=${OUTCOME:-unknown}" >> "$GITHUB_OUTPUT"
        echo "### Code Reviewer: $REPO#$PR — ${OUTCOME:-unknown}" >> "$GITHUB_STEP_SUMMARY"

    - name: Record an interrupted run
      # A cancelled or timed-out job never reaches the reviewer's own error handling, so its review
      # keeps whatever stage it was in and holds the repo's single review slot. Best-effort: GitHub
      # allows a short grace period on cancellation. `abandon` ignores a review that was merely
      # waiting for answers, and a stage that failed on its own has already recorded itself.
      if: ${{ cancelled() || failure() }}
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        DATABASE_URL: ${{ inputs.database-url }}
        REPO: ${{ inputs.repo }}
        PR: ${{ steps.review.outputs.pr }}
      run: |
        set -euo pipefail
        if [ -n "$PR" ]; then
          node bin/code-reviewer.mjs abandon "$REPO" "$PR" \
            'the GitHub Actions run was cancelled or timed out'
        fi
